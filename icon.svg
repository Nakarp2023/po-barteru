<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087b50"/><stop offset=".45" stop-color="#00472f"/><stop offset="1" stop-color="#001b14"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fff7b7"/><stop offset=".28" stop-color="#ffdc61"/><stop offset=".58" stop-color="#f5b92f"/><stop offset=".8" stop-color="#a9650b"/><stop offset="1" stop-color="#ffe87c"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#d5ffe0"/><stop offset=".24" stop-color="#58f3b0"/><stop offset=".55" stop-color="#12c982"/><stop offset=".82" stop-color="#006343"/><stop offset="1" stop-color="#a8ffce"/></linearGradient>
 <radialGradient id="glow" cx=".3" cy=".1" r=".9"><stop stop-color="#3dffac" stop-opacity=".3"/><stop offset="1" stop-color="#001c14" stop-opacity="0"/></radialGradient>
