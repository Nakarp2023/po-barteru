<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153f35"><title>Модерация · ПО БАРТЕРУ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--g:#153f35;--bg:#f4f6f1;--line:#e0e6dd;--muted:#66736b;--ink:#17231e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:850;color:var(--g);font-size:21px}.tag{font-size:12px;background:#e5efd9;color:#345b42;border-radius:999px;padding:7px 10px;font-weight:700}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.field textarea{min-height:80px;resize:vertical}button{border:0;border-radius:11px;background:var(--g);color:white;padding:11px 14px;font:700 14px inherit;cursor:pointer}button.secondary{background:#edf2e9;color:var(--g)}button.danger{background:#fff0ed;color:#9d3d32}button:disabled{opacity:.5;cursor:wait}.muted{color:var(--muted)}.hidden{display:none!important}.layout{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:14px}.list{display:grid;gap:8px}.item{width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);padding:13px;border-radius:14px}.item.selected{border:2px solid #8dbb79;background:#f8fbf5}.item strong{display:block;margin-bottom:5px}.item small{color:var(--muted)}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf2e9;color:#425b48;font-size:11px;font-weight:800}.status.new{background:#fff3d8;color:#7a5b17}.detail h2{margin:4px 0 12px;font-size:20px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.meta div{background:#f7f9f5;border-radius:10px;padding:10px;overflow-wrap:anywhere}.meta small{display:block;color:var(--muted);margin-bottom:4px}.log{border-top:1px solid var(--line);padding:10px 0}.log:first-child{border-top:0}.log b{font-size:13px}.log p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a3342c}.success{color:#276342}@media(max-width:720px){.layout{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.wrap{padding:14px 12px}}
.globalStats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:23px;margin-top:6px;color:var(--g)}@media(max-width:720px){.globalStats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child{grid-column:span 2}}</style></head><body><main class="wrap">
<header class="head"><div><div class="brand">ПО БАРТЕРУ · Модерация</div><div class="muted">Staging / тестовый контур</div></div><div class="row"><span id="who" class="tag">Не авторизован</span><button id="logout" class="secondary hidden">Выйти</button></div></header>
<section id="login" class="panel"><h2>Вход администратора</h2><p class="muted">Используется отдельная Staging-сессия Supabase. Доступ проверяется по app_metadata.role = admin.</p><form id="loginForm"><label class="field">Email<input id="email" type="email" autocomplete="username" required></label><label class="field">Пароль<input id="password" type="password" autocomplete="current-password" required></label><div class="row"><button id="signin" type="submit">Войти</button><span id="loginMsg" class="muted" aria-live="polite"></span><button id="bootstrap" type="button" class="secondary hidden">Активировать администратора</button></div></form></section>
<section id="app" class="hidden"><div class="row panel"><label>Статус <select id="filter"><option value="new">Новые</option><option value="all">Все</option><option value="reviewed">На рассмотрении</option><option value="dismissed">Отклонены</option><option value="resolved">Решены</option></select></label><button id="refresh" class="secondary">Обновить очередь</button><span id="queueInfo" class="muted"></span></div>
<div id="globalStats" class="globalStats"><div class="stat"><small>Всего</small><strong>—</strong></div></div><div class="layout"><section class="panel"><h3>Жалобы</h3><label class="field">Поиск по архиву (ID или текст причины)<input id="search" type="search" placeholder="UUID или фрагмент причины…"><small class="muted">Поиск выполняется по всей базе, а не только по текущей странице.</small></label><div id="queue" class="list"></div><div class="row" style="margin-top:10px"><button id="prevPage" class="secondary">← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" class="secondary">Далее →</button></div></section><section class="panel detail"><div id="detailEmpty" class="muted">Выберите жалобу слева.</div><div id="detail" class="hidden"></div></section></div></section>
<div id="notice" role="status" aria-live="polite"></div></main>
<script>
const URL="https://noiryqvoohqrfmemfnne.supabase.co",KEY="sb_publishable_ZQysYhUfU2mNnM2Ce1jzIw_CWFj5AM_";
const db=window.supabase?.createClient?window.supabase.createClient(URL,KEY):null;let reports=[],selected=null,user=null,page=0;const PAGE_SIZE=100;let searchTimer=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label={new:"Новая",reviewed:"На рассмотрении",dismissed:"Отклонена",resolved:"Решена"};
function msg(s,cls=""){ $("notice").className=cls;$("notice").textContent=s; }
function setBusy(b){$("signin").disabled=b;$("refresh").disabled=b;}
async function guard(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;if(!user){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden");$("who").textContent="Не авторизован";return false}
if(user.app_metadata?.role!=="admin"){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.remove("hidden");$("who").textContent=user.email+" · ожидает роль";$("bootstrap").classList.remove("hidden");$("loginMsg").textContent="Вход выполнен. Можно активировать роль администратора Staging.";return false}
$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");$("who").textContent=user.email+" · admin";return true}
async function handleAdminLogin(event){if(event)event.preventDefault();try{setBusy(true);$("signin").textContent="Входим…";$("loginMsg").textContent="Подключение к Staging Supabase…";msg("Запрос авторизации отправлен.");if(!db)throw new Error("Библиотека Supabase не загрузилась (CDN).");const email=$("email").value.trim(),password=$("password").value;if(!email||!password)throw new Error("Заполните email и пароль.");const result=await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;$("loginMsg").textContent="Вход успешен. Проверяем права…";if(await guard()){msg("Авторизация успешна.","success");await loadQueue()}}catch(e){const text=e?.message||String(e);$("loginMsg").textContent="Ошибка входа: "+text;msg("Ошибка входа: "+text,"error")}finally{setBusy(false);$("signin").textContent="Войти"}}
// Isolated sign-in handler, independent of form submission.
$("signin").type="button";
$("signin").onclick=async function(event){
 event.preventDefault();const b=$("signin"),m=$("loginMsg");b.disabled=true;b.textContent="Входим…";m.textContent="Обработчик запущен: подключение к Supabase";msg("Обработчик входа запущен.");
 try{if(!window.supabase?.createClient)throw new Error("Supabase JS CDN не загрузился.");const email=$("email").value.trim(),password=$("password").value;if(!email||!password)throw new Error("Введите email и пароль.");const authClient=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const {data,error}=await authClient.auth.signInWithPassword({email,password});if(error)throw error;m.textContent="Вход успешен. Проверяем права…";await db.auth.setSession(data.session);location.href=location.pathname+"?auth="+Date.now();}
 catch(e){m.textContent="Ошибка входа: "+(e.message||String(e));msg(m.textContent,"error")}
 finally{b.disabled=false;b.textContent="Войти"}
};
window.addEventListener("error",event=>{const text="Ошибка JS: "+(event.message||"неизвестная");const n=$("loginMsg");if(n)n.textContent=text;const notice=$("notice");if(notice){notice.textContent=text;notice.className="error"}});
window.addEventListener("unhandledrejection",event=>{const text="Ошибка запроса: "+(event.reason?.message||String(event.reason));$("loginMsg").textContent=text;msg(text,"error")});
$("logout").onclick=async()=>{await db.auth.signOut();selected=null;await guard()};
$("bootstrap").onclick=async()=>{const secret=prompt("Одноразовый секрет ADMIN_BOOTSTRAP_SECRET (Staging):");if(!secret)return;$("bootstrap").disabled=true;try{const {data:{session}}=await db.auth.getSession();const response=await fetch(URL+"/functions/v1/admin-bootstrap",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({secret})});const result=await response.json();if(!response.ok)throw new Error(result.error||"Активация не выполнена");$("loginMsg").textContent=result.message;msg("Роль администратора назначена. Выйдите и войдите снова.","success");$("bootstrap").classList.add("hidden")}catch(e){$("loginMsg").textContent=e.message}finally{$("bootstrap").disabled=false}};
$("refresh").onclick=()=>{page=0;loadQueue()};$("filter").onchange=()=>{page=0;loadQueue()};$("search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=0;loadQueue()},350)};$("prevPage").onclick=()=>{if(page>0){page--;loadQueue()}};$("nextPage").onclick=()=>{if(reports.length===PAGE_SIZE){page++;loadQueue()}};
async function loadGlobalStats(){const states=["all","new","reviewed","resolved","dismissed"];const names=["Всего жалоб","Новые","В работе","Решены","Отклонены"];try{const rs=await Promise.all(states.map(s=>{let q=db.from("reports").select("id",{count:"exact",head:true});if(s!=="all")q=q.eq("status",s);return q}));for(const x of rs){if(x.error)throw x.error} $("globalStats").innerHTML=rs.map((x,i)=>'<div class="stat"><small>'+names[i]+'</small><strong>'+Number(x.count||0).toLocaleString("ru-RU")+'</strong></div>').join("")}catch(e){$("globalStats").innerHTML='<div class="stat"><small>Глобальная статистика</small><strong>Недоступна</strong></div>'}}
async function loadQueue(){if(!user||user.app_metadata?.role!=="admin")return;await loadGlobalStats();setBusy(true);$("queue").innerHTML='<p class="muted">Загрузка…</p>';try{let q=db.from("reports").select("id,reporter_id,listing_id,reported_user_id,reason,status,created_at").order("created_at",{ascending:false});const f=$("filter").value;if(f!=="all")q=q.eq("status",f);const term=$("search").value.trim();if(term){const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;if(uuid.test(term))q=q.or("id.eq."+term+",reporter_id.eq."+term+",reported_user_id.eq."+term+",listing_id.eq."+term);else q=q.ilike("reason","%"+term.replace(/[\\%_]/g,"\\$&")+"%");q=q.range(page*PAGE_SIZE,page*PAGE_SIZE+PAGE_SIZE-1);const {data,error}=await q;if(error)throw error;reports=data||[];$("pageInfo").textContent="Страница "+(page+1);$("prevPage").disabled=page===0;$("nextPage").disabled=reports.length<PAGE_SIZE;$("queueInfo").textContent="На странице ("+reports.length+"): новые — "+reports.filter(x=>x.status==="new").length+" · в работе — "+reports.filter(x=>x.status==="reviewed").length+" · решены — "+reports.filter(x=>x.status==="resolved").length+" · отклонены — "+reports.filter(x=>x.status==="dismissed").length;renderQueue();if(selected&&reports.some(r=>r.id===selected))await openReport(selected);else{selected=null;$("detail").classList.add("hidden");$("detailEmpty").classList.remove("hidden")}}catch(e){$("queue").innerHTML='<p class="error">'+esc(e.message)+'</p>';msg("Не удалось загрузить очередь: "+e.message,"error")}finally{setBusy(false)}}
function renderQueue(){const root=$("queue");const rows=reports;if(!rows.length){root.innerHTML='<p class="muted">По этому запросу жалоб нет.</p>';return}root.innerHTML=rows.map(r=>'<button class="item '+(r.id===selected?'selected':'')+'" data-id="'+esc(r.id)+'"><strong>'+esc(r.reason||"Без причины")+'</strong><small>'+esc(new Date(r.created_at).toLocaleString("ru-RU"))+'</small><br><span class="status '+esc(r.status)+'">'+esc(label[r.status]||r.status)+'</span></button>').join("");root.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openReport(b.dataset.id))}
async function openReport(id){selected=id;renderQueue();$("detailEmpty").classList.add("hidden");$("detail").classList.remove("hidden");$("detail").innerHTML='<p class="muted">Загружаем карточку…</p>';const r=reports.find(x=>x.id===id);if(!r)return;
const {data:actions,error}=await db.from("report_moderation_actions").select("id,actor_id,action,note,created_at").eq("report_id",id).order("created_at",{ascending:false}).limit(50);if(error){$("detail").innerHTML='<p class="error">'+esc(error.message)+'</p>';return}
$("detail").innerHTML='<span class="status">'+esc(label[r.status]||r.status)+'</span><div class="row"><h2>Жалоба '+esc(r.id)+'</h2><button id="copyReportId" class="secondary">Копировать ID</button></div><div class="meta"><div><small>Автор жалобы</small>'+esc(r.reporter_id)+'</div><div><small>На пользователя</small>'+esc(r.reported_user_id||"—")+'</div><div><small>Объявление</small>'+esc(r.listing_id||"—")+'</div><div><small>Создана</small>'+esc(new Date(r.created_at).toLocaleString("ru-RU"))+'</div></div><div class="panel"><b>Причина / описание</b><p style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(r.reason)+'</p></div><h3>Действие модератора</h3><label class="field">Комментарий (необязательно)<textarea id="actionNote" placeholder="Краткое пояснение решения"></textarea></label><div class="row"><button data-action="reviewed">В работу</button><button data-action="resolved">Решить</button><button data-action="dismissed" class="danger">Отклонить</button><button data-action="reopened" class="secondary">Переоткрыть</button></div><h3>Журнал</h3><div id="journal">'+(actions||[]).map(a=>'<div class="log"><b>'+esc(a.action)+' · '+esc(new Date(a.created_at).toLocaleString("ru-RU"))+'</b><p>'+esc(a.note||"Без комментария")+'</p><small class="muted">actor: '+esc(a.actor_id)+'</small></div>').join("")||'<p class="muted">Записей пока нет.</p>'+'</div>';
$("copyReportId").onclick=async()=>{try{await navigator.clipboard.writeText(r.id);msg("ID жалобы скопирован.","success")}catch(e){prompt("Скопируйте ID жалобы:",r.id)}};$("detail").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>processAction(b.dataset.action,b))}
async function processAction(action,button){if(!user||user.app_metadata?.role!=="admin")return;const r=reports.find(x=>x.id===selected);if(!r)return;const note=$("actionNote")?.value.trim()||null;button.disabled=true;try{const {error}=await db.rpc("admin_process_report",{p_report_id:r.id,p_action:action,p_note:note});if(error)throw error;msg("Решение и запись журнала сохранены атомарно.","success");await loadQueue();if(reports.some(x=>x.id===r.id))await openReport(r.id)}catch(e){msg("Ошибка: "+e.message,"error")}finally{button.disabled=false}}
db.auth.onAuthStateChange(async(event,session)=>{user=session?.user||null;if(event==="SIGNED_OUT"){await guard()}});
(async()=>{if(await guard())await loadQueue()})();
</script>
<script>
/* Emergency isolated auth layer: executes separately from the moderation app script. */
(function(){
 const byId=id=>document.getElementById(id);
 const btn=byId("signin"),form=byId("loginForm"),out=byId("loginMsg"),notice=byId("notice");
 if(!btn||!out)return;
 btn.type="button";
 if(form)form.addEventListener("submit",e=>e.preventDefault(),true);
 btn.onclick=async function(e){
  if(e)e.preventDefault();
  btn.disabled=true;btn.textContent="Входим…";
  out.textContent="Диагностика: обработчик нажатия сработал.";
  if(notice){notice.textContent="Запущен отдельный вход Supabase";notice.className=""}
  try{
   if(!window.supabase||!window.supabase.createClient)throw Error("Supabase CDN недоступен");
   const email=byId("email").value.trim(),password=byId("password").value;
   if(!email||!password)throw Error("Заполните email и пароль");
   const client=window.supabase.createClient("https://noiryqvoohqrfmemfnne.supabase.co","sb_publishable_ZQysYhUfU2mNnM2Ce1jzIw_CWFj5AM_",{auth:{persistSession:true,autoRefreshToken:true}});
   const {data,error}=await client.auth.signInWithPassword({email,password});
   if(error)throw error;
   out.textContent="Supabase вход успешен. Сессия сохранена; открываю панель…";
/* Auth client persists the session in Supabase storage. Reload lets the app client read it and run guard(). */
location.replace(location.pathname+"?auth=success");
  }catch(err){
   out.textContent="AUTH ERROR: "+(err&&err.message||String(err));
   if(notice){notice.textContent=out.textContent;notice.className="error"}
  }finally{btn.disabled=false;btn.textContent="Войти"}
 };
 window.addEventListener("error",e=>{out.textContent="JS ERROR: "+e.message});
})();
</script></body></html>
