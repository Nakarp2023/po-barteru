name: Stable navigation browser tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stable-navigation.yml"
      - "playwright.config.js"
      - "tests/navigation/**"
      - "index.html"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Render Preview URL"
        required: false
        default: "https://po-barteru-stable-navigation-preview.onrender.com"

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run navigation tests
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test
