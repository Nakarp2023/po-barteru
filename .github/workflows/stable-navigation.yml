name: Stable navigation browser tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stable-navigation.yml"
      - "playwright.config.js"
      - "tests/navigation/**"
      - "index.html"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Render Preview URL"
        required: false
        default: "https://po-barteru-stable-navigation-preview.onrender.com"

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce Preview Supabase isolation
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const previewRef = 'noiryqvoohqrfmemfnne';
          const productionRef = 'qxsnjksepzmpsifpxyea';
          if (!html.includes('https://' + previewRef + '.supabase.co')) throw new Error('Preview must point to Staging Supabase');
          if (html.includes('const SUPABASE_URL="https://' + productionRef + '.supabase.co"')) throw new Error('Production Supabase URL must not be used as the app client URL in Preview');
          if (!html.includes('IS_PRODUCTION_HOST&&SUPABASE_PROJECT_REF!=="' + productionRef + '"')) throw new Error('Production host safety guard is missing');
          console.log('Preview Supabase isolation checks passed.');
          NODE
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the matching Render Preview commit
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          url="${BASE_URL:-https://po-barteru-stable-navigation-preview.onrender.com}"
          for attempt in $(seq 1 60); do
            if curl -fsSL "$url" | grep -Fq 'data-navigation-build="nav-stage-v2-tabs-only-20261101"'; then
              echo "Render Preview contains the expected navigation build."
              exit 0
            fi
            echo "Waiting for Render Preview deployment ($attempt/60)..."
            sleep 5
          done
          echo "Render Preview did not expose the expected build marker in time."
          exit 1
      - name: Run navigation tests
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test
