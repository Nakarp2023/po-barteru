name: Staging navigation motion validation

on:
  push:
    branches:
      - 'qa/**'
      - 'work/integrated-staging-navigation-no-gestures'
  pull_request:
    branches:
      - 'work/integrated-staging-navigation-no-gestures'
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging URL to test
        required: false
        default: https://po-barteru-no-gestures-staging.onrender.com/

permissions:
  contents: read

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Desktop and iPhone smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url || 'https://po-barteru-no-gestures-staging.onrender.com/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Use the live, non-inert app node; transition snapshots are inert siblings.
      - name: Run navigation motion browser tests against Staging
        run: |
          mkdir -p artifacts
          node tests/staging-navigation-motion-validation.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-navigation-motion-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
