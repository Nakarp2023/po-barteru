<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ПО БАРТЕРУ · Администрирование</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--g:#153f35;--lime:#d7efaa;--bg:#f4f6f2;--ink:#17231e;--mut:#6c7971;--line:#e1e7df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,system-ui}header{background:var(--g);color:#fff;padding:20px max(20px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:20px}header a{color:var(--lime)}main{max-width:1200px;margin:24px auto;padding:0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab,button{border:0;border-radius:12px;padding:11px 15px;background:white;color:var(--g);font-weight:700;cursor:pointer}.tab.active,.primary{background:var(--g);color:white}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input,.row select,input,textarea,select{border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;max-width:100%}.row input{flex:1;min-width:200px}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item h3{margin:0 0 8px;font-size:16px}.meta{color:var(--mut);font-size:13px;line-height:1.5}.status{display:inline-block;background:#edf2e9;color:#315b45;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.danger{color:#a43d35;background:#fff0ee}.empty{color:var(--mut);padding:20px 0}.hidden{display:none!important}dialog{border:0;border-radius:18px;padding:22px;width:min(520px,calc(100% - 24px));box-shadow:0 20px 80px #0003}dialog::backdrop{background:#0b2019a8}dialog form{display:grid;gap:12px}textarea{min-height:90px}small{color:var(--mut)}#supportList .support-ticket label{display:block;font-weight:700;margin:12px 0 6px}#supportList .support-ticket textarea,#supportList .support-ticket select{display:block;width:100%;max-width:100%;min-width:0}#supportList .support-ticket textarea{min-height:130px;line-height:1.5}#supportList .support-ticket .actions button{flex:0 0 auto}
/* Admin profile drawer */ #userProfileDialog{width:min(900px,calc(100% - 24px));max-height:90vh;overflow:auto;padding:0} .profile-head{background:var(--g);color:#fff;padding:22px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.profile-head h2{margin:0 0 7px}.profile-head .meta{color:#d5e5dc}.profile-body{padding:20px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.stat{border:1px solid var(--line);background:#f7f9f5;border-radius:13px;padding:13px}.stat b{display:block;font-size:23px;color:var(--g)}.stat span{font-size:12px;color:var(--mut)}.profile-section{border-top:1px solid var(--line);padding:16px 0}.profile-section h3{margin:0 0 12px}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.profile-field{padding:10px;background:#f7f9f5;border-radius:10px;overflow-wrap:anywhere}.profile-field small{display:block;margin-bottom:4px}.profile-item{padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-grid{grid-template-columns:1fr}.profile-head{padding:16px}.profile-body{padding:14px}}\ndialog form{display:flex;flex-direction:column;align-items:stretch;gap:14px}dialog form h3{margin:0 0 4px}dialog form label{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,1.4fr);align-items:center;gap:12px;font-weight:600}dialog form input,dialog form select,dialog form textarea{width:100%;min-width:0;font-weight:400}dialog form textarea{min-height:100px;resize:vertical}dialog form button{width:100%}dialog form button[type=button]{background:#f3f6f2}@media(max-width:520px){dialog form label{grid-template-columns:1fr;gap:6px}}@media(max-width:600px){header{padding:16px}main{padding:0 12px;margin:14px auto}.panel{padding:14px}.tab{padding:10px 12px;font-size:13px}.actions button{flex:1}}
</style></head><body><header><strong>ПО БАРТЕРУ · Админ-панель</strong><a href="/">← На сайт</a></header><main>
<div id="gate" class="panel">Проверяем права администратора…</div><div id="app" class="hidden">
<div class="tabs"><button class="tab" data-tab="support">Техподдержка</button><button class="tab active" data-tab="reports">Жалобы</button><button class="tab" data-tab="users">Пользователи</button><button class="tab" data-tab="listings">Объявления</button><button class="tab" data-tab="sanctions">Санкции</button><button class="tab" data-tab="logs">Журнал действий</button></div>
<section id="support" class="panel hidden"><h2>Обращения в поддержку</h2><div class="row"><select id="supportFilter"><option value="">Все обращения</option><option value="open">Открытые</option><option value="answered">Ответили</option><option value="closed">Закрытые</option></select><button onclick="loadSupport()">Обновить</button></div><div id="supportList"></div></section>
<section id="reports" class="panel"><h2>Жалобы</h2><div class="row"><select id="reportFilter"><option value="">Все статусы</option><option value="new">Новая</option><option value="reviewing">На рассмотрении</option><option value="resolved">Решена</option><option value="rejected">Отклонена</option></select><button onclick="loadReports()">Обновить</button></div><div id="reportsList"></div></section>
<section id="users" class="panel hidden"><h2>Пользователи</h2><div class="row"><input id="userQuery" placeholder="UUID, email или имя"><button class="primary" onclick="searchUsers()">Найти</button></div><div id="usersList"></div></section>
<section id="listings" class="panel hidden"><h2>Объявления</h2><div class="row"><input id="listingQuery" placeholder="Название или ID объявления"><button class="primary" onclick="searchListings()">Найти</button></div><div id="listingsList"></div></section>
<section id="sanctions" class="panel hidden"><h2>Действующие санкции</h2><button onclick="loadSanctions()">Обновить</button><div id="sanctionsList"></div></section>
<section id="logs" class="panel hidden"><h2>Журнал действий</h2><div class="row log-filters"><select id="logAction"><option value="">Все действия</option><option value="report">Жалобы</option><option value="support">Техподдержка</option><option value="sanction">Санкции</option><option value="listing">Объявления</option></select><input id="logSearch" placeholder="UUID пользователя / жалобы / обращение"><input id="logFrom" type="date" aria-label="Дата с"><input id="logTo" type="date" aria-label="Дата по"><button onclick="loadLogs()">Применить</button><button onclick="resetLogFilters()">Сбросить</button></div><div id="logsList"></div></section></div></main>
<dialog id="actionDialog"><form id="actionForm"><h3 id="dialogTitle">Действие</h3><input id="targetId" type="hidden"><label>Тип меры<select id="sanctionType"><option value="warning">Предупреждение</option><option value="messages_restricted">Ограничение сообщений</option><option value="listings_restricted">Ограничение публикаций</option><option value="temporary_ban">Временная блокировка</option><option value="permanent_ban">Постоянная блокировка</option></select></label><label>Срок (часов, для временной блокировки)<input id="duration" type="number" min="1" max="8760" value="24"></label><label>Серьёзность<select id="severity"><option value="low">Низкая</option><option value="medium">Средняя</option><option value="high">Высокая</option><option value="critical">Критическая</option></select></label><label>Причина<textarea id="reason" required minlength="3" placeholder="Обоснование решения"></textarea></label><button class="primary" type="submit">Подтвердить действие</button><button type="button" onclick="actionDialog.close()">Отмена</button></form></dialog>
<dialog id="userProfileDialog"><div id="userProfileContent"></div><div style="padding:0 20px 18px"><button onclick="userProfileDialog.close()">Закрыть карточку</button></div></dialog>
<script>
const sb=supabase.createClient("https://noiryqvoohqrfmemfnne.supabase.co","sb_publishable_ZQysYhUfU2mNnM2Ce1jzIw_CWFj5AM_");
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const statuses={new:"Новая",reviewing:"На рассмотрении",resolved:"Решена",rejected:"Отклонена",reviewed:"Проверена",dismissed:"Отклонена",reopened:"Возобновлена",active:"Активно",moderation:"Скрыто модерацией",archived:"В архиве",warning:"Предупреждение",messages_restricted:"Ограничение сообщений",listings_restricted:"Ограничение публикаций",temporary_ban:"Временная блокировка",permanent_ban:"Постоянная блокировка"};
const ruStatus=s=>statuses[s]||s||"—";const date=s=>s?new Date(s).toLocaleString("ru-RU"):"—";const err=e=>alert(e?.message||"Не удалось выполнить действие");
let adminInitRunning=false;
async function init(){
 if(adminInitRunning)return;adminInitRunning=true;
 const gate=$("gate");gate.className="panel";
 const stage=(msg)=>{gate.textContent=msg;console.info("[admin]",msg)};
 let timer;
 try{
  stage("1/3 · Проверяем библиотеку Supabase…");
  if(!window.supabase?.createClient)throw new Error("SDK Supabase не загрузился (CDN). Обновите страницу или проверьте блокировщик.");
  stage("2/3 · Получаем сохранённую сессию… Это может занять несколько секунд.");
  const result=await Promise.race([
   sb.auth.getSession(),
   new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error("Supabase Auth не ответил за 8 секунд. Возможна блокировка локального хранилища/сессии браузера.")),8000)})
  ]);
  clearTimeout(timer);
  if(result.error)throw result.error;
  const session=result.data?.session;
  if(!session){gate.innerHTML='Сессия не найдена. <a href="/">Вернитесь на сайт</a>, войдите в аккаунт и откройте админку снова.';return}
  if(session.user.app_metadata?.role!=="admin"){gate.textContent="Доступ закрыт: у аккаунта нет роли администратора.";return}
  stage("3/3 · Администратор подтверждён · "+session.user.email);
  $("app").classList.remove("hidden");
  await Promise.allSettled([loadSupport(),loadReports()]);
 }catch(e){
  console.error("admin init",e);
  gate.innerHTML='Ошибка проверки: '+esc(e?.message||e)+'<div class="actions"><button class="primary" onclick="init()">Повторить</button><a href="/">На сайт</a></div>';
 }finally{clearTimeout(timer);adminInitRunning=false}
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));["support","reports","users","listings","sanctions","logs"].forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.tab));});
async function loadSupport(){try{const f=$("supportFilter").value;const {data,error}=await sb.rpc("admin_support_tickets",{p_status:f||null});if(error)throw error;const rows=data||[];$("supportList").innerHTML=rows.length?rows.map(t=>`<article class="item support-ticket" id="ticket-${t.id}"><h3>${esc(t.subject||"Без темы")} <span class="status">${esc(({open:"Открыто",in_progress:"В работе",answered:"Ответили",closed:"Закрыто"}[t.status]||t.status))}</span></h3><div class="meta">Категория: ${esc(({account:"Аккаунт",listing:"Объявление",exchange:"Обмен",payment:"Оплата",safety:"Безопасность",technical:"Техническая проблема",other:"Другое"}[t.category]||t.category))} · ${esc(t.user_email||t.user_id)} · ${date(t.created_at)}<br>ID: ${esc(t.id)}</div><p style="white-space:pre-wrap">${esc(t.message)}</p>${t.support_reply?`<div class="panel" style="background:#f5f8f3"><b>Последний ответ</b><p style="white-space:pre-wrap">${esc(t.support_reply)}</p><small class="meta">Ответ: ${date(t.replied_at)}</small></div>`:""}<div class="actions"><button onclick="loadTicketHistory('${t.id}')">История ответов</button><button class="primary" onclick="toggleTicketReply('${t.id}')">${t.support_reply?"Ответить повторно":"Написать ответ"}</button></div><div id="ticket-history-${t.id}" class="hidden profile-section"></div><div id="reply-form-${t.id}" class="hidden" style="margin-top:12px"><label>Ответ пользователю</label><textarea id="reply-text-${t.id}" rows="5" maxlength="5000" placeholder="Введите подробный ответ…">${esc(t.support_reply||"")}</textarea><label style="display:block;margin-top:10px">Статус обращения</label><select id="reply-status-${t.id}"><option value="open" ${t.status==="open"?"selected":""}>Открыто</option><option value="answered" ${t.status==="answered"?"selected":""}>Ответили</option><option value="closed" ${t.status==="closed"?"selected":""}>Закрыто</option></select><div class="actions"><button class="primary" onclick="submitSupportReply('${t.id}')">Отправить ответ</button><button onclick="toggleTicketReply('${t.id}')">Отмена</button></div></div></article>`).join(""):'<div class="empty">Обращений нет</div>'}catch(e){$("supportList").innerHTML='<div class="empty">Ошибка загрузки: '+esc(e.message)+' <button onclick="loadSupport()">Повторить</button></div>';console.error(e)}}
async function loadTicketHistory(id){
 const box=$("ticket-history-"+id);box.classList.remove("hidden");box.innerHTML="Загрузка…";
 const {data,error}=await sb.rpc("admin_support_ticket_history",{p_ticket_id:id});
 if(error){box.innerHTML="<p>"+esc(error.message)+"</p>";return}
 const items=data||[];box.innerHTML="<h3>История ответов ("+items.length+")</h3>"+(items.length?items.map(x=>'<div class="profile-item"><p style="white-space:pre-wrap">'+esc(x.reply)+'</p><div class="meta">'+date(x.created_at)+' · '+esc(ruStatus(x.status))+'</div></div>').join(""):'<p class="meta">Новых записей истории пока нет; последний ответ показан выше.</p>');
}
function toggleTicketReply(id){$("reply-form-"+id).classList.toggle("hidden")}
async function submitSupportReply(id){const reply=$("reply-text-"+id).value.trim(),status=$("reply-status-"+id).value;if(!reply){alert("Введите ответ пользователю");return}if(reply.length>5000){alert("Ответ слишком длинный (максимум 5000 символов)");return}const btn=$("reply-form-"+id).querySelector(".primary");btn.disabled=true;btn.textContent="Отправляем…";const {error}=await sb.rpc("admin_reply_support_ticket",{p_ticket_id:id,p_reply:reply,p_status:status});if(error){btn.disabled=false;btn.textContent="Отправить ответ";return err(error)}await loadSupport();await loadLogs()}
async function loadReports(){
 let q=sb.from("reports").select("*").order("created_at",{ascending:false}).limit(100),f=$("reportFilter").value;if(f)q=q.eq("status",f);
 let {data,error}=await q;if(error)return err(error);data=data||[];
 const lids=[...new Set(data.map(r=>r.listing_id).filter(Boolean))],mids=[...new Set(data.map(r=>r.message_id).filter(Boolean))],cids=[...new Set(data.map(r=>r.conversation_id).filter(Boolean))];
 let listingMap={},messageMap={},chatMap={};
 if(lids.length){let z=await sb.from("listings").select("id,title,user_id,status").in("id",lids);if(!z.error)(z.data||[]).forEach(l=>listingMap[l.id]=l)}
 if(mids.length){let z=await sb.from("messages").select("id,conversation_id,sender_id,body,created_at").in("id",mids);if(!z.error)(z.data||[]).forEach(m=>messageMap[m.id]=m)}
 if(cids.length){let z=await sb.from("conversations").select("id,participant_one,participant_two,proposal_id").in("id",cids);if(!z.error)(z.data||[]).forEach(c=>chatMap[c.id]=c)}
 $("reportsList").innerHTML=data.length?data.map(r=>{let l=listingMap[r.listing_id],m=messageMap[r.message_id],c=chatMap[r.conversation_id];return '<article class="item"><h3>Жалоба · '+esc(({listing:"На объявление",user:"На пользователя",message:"На сообщение",chat:"На чат"}[r.report_type]||r.report_type||"Общая"))+' <span class="status">'+esc(ruStatus(r.status))+'</span></h3><div class="report-reason">'+esc(r.reason||"Без описания")+'</div>'+(l?'<div class="profile-field"><small>Объявление</small><b>'+esc(l.title)+'</b><div class="meta">Автор: '+esc(l.user_id)+' · '+esc(ruStatus(l.status))+'</div></div>':'')+(m?'<div class="profile-field"><small>Сообщение из чата</small><p>'+esc(m.body)+'</p><div class="meta">Отправитель: '+esc(m.sender_id)+' · '+date(m.created_at)+'</div></div>':'')+(c?'<div class="meta">Чат: '+esc(c.id)+' · Участники: '+esc(c.participant_one)+' / '+esc(c.participant_two)+'</div>':'')+(r.details?'<div class="meta">Дополнительные сведения: '+esc(r.details)+'</div>':'')+'<div class="meta">ID жалобы: '+esc(r.id)+' · Автор: '+esc(r.reporter_id)+' · Нарушитель: '+esc(r.reported_user_id||m?.sender_id||"—")+' · '+date(r.created_at)+'</div><div class="actions"><button onclick="userDetails(\''+(r.reported_user_id||m?.sender_id||"")+'\')">Карточка нарушителя</button>'+(r.listing_id?'<button onclick="viewListing(\''+r.listing_id+'\')">Объявление</button>':'')+'<button onclick="reportAction(\''+r.id+'\',\'reviewed\')">Проверена</button><button onclick="reportAction(\''+r.id+'\',\'resolved\')">Решена</button><button onclick="reportAction(\''+r.id+'\',\'dismissed\')">Отклонить</button><button onclick="reportAction(\''+r.id+'\',\'reopened\')">Вернуть в работу</button><button class="danger" onclick="openSanction(\''+(r.reported_user_id||m?.sender_id||"")+'\',\''+r.id+'\')">Санкция</button></div></article>'}).join(""):'<div class="empty">Жалоб нет</div>';
}
function viewListing(id){document.querySelector('[data-tab="listings"]').click();$("listingQuery").value=id;searchListings()}
async function reportAction(id,action){let note=prompt("Комментарий модератора (необязательно):","");if(note===null)return;let {error}=await sb.rpc("admin_process_report",{p_report_id:id,p_action:action,p_note:note});if(error)return err(error);await loadReports();await loadLogs()}
async function searchUsers(){let {data,error}=await sb.rpc("admin_search_users",{p_query:$("userQuery").value,p_limit:50});if(error)return err(error);$("usersList").innerHTML=data.length?data.map(u=>`<article class="item"><h3>${esc(u.display_name||"Без имени")} <span class="status">Нарушений: ${u.violations}</span></h3><div class="meta">${esc(u.email)} · ${esc(u.user_id)} · Активных санкций: ${u.active_sanctions}</div><div class="actions"><button onclick="userDetails('${u.user_id}')">Профиль и история</button><button class="danger" onclick="openSanction('${u.user_id}',null)">Назначить санкцию</button></div></article>`).join(""):'<div class="empty">Пользователи не найдены</div>'}
async function userDetails(id){
 const box=$("userProfileContent");box.innerHTML='<div class="profile-body">Загружаем карточку пользователя…</div>';userProfileDialog.showModal();
 try{
  const results=await Promise.all([
   sb.rpc("admin_user_overview",{p_user_id:id}),
   sb.from("reports").select("id,report_type,reason,status,created_at,listing_id,reported_user_id,message_id,conversation_id,details,reporter_id").or("reported_user_id.eq."+id+",reporter_id.eq."+id).order("created_at",{ascending:false}).limit(30),
   sb.from("user_sanctions").select("id,sanction_type,reason,created_at,ends_at,revoked_at").eq("user_id",id).order("created_at",{ascending:false}).limit(20),
   sb.from("user_violations").select("*").eq("user_id",id).order("created_at",{ascending:false}).limit(30),
   sb.from("listings").select("id,title,status,created_at").eq("user_id",id).order("created_at",{ascending:false}).limit(50)
  ]);
  const u=results[0].data,reports=results[1].data||[],sanctions=results[2].data||[],violations=results[3].data||[],ownedListings=results[4].data||[];
  if(results.some(x=>x.error))throw results.find(x=>x.error).error;
  const profile=u.profile||{},email=u.email||"—",name=profile.display_name||"Без имени",active=(u.sanctions||[]).length,viol=(u.violations||[]).length;
  const field=(label,value)=>'<div class="profile-field"><small>'+esc(label)+'</small><b>'+esc(value??"—")+'</b></div>';
  box.innerHTML='<div class="profile-head"><div><h2>'+esc(name)+'</h2><div class="meta">'+esc(email)+'<br>'+esc(id)+'</div></div><button onclick="userProfileDialog.close()">✕</button></div><div class="profile-body">'+
  '<div class="stats"><div class="stat"><b>'+Number(u.listing_count||0)+'</b><span>Объявлений</span></div><div class="stat"><b>'+Number(u.reports_received||0)+'</b><span>Жалоб на пользователя</span></div><div class="stat"><b>'+viol+'</b><span>Нарушений</span></div><div class="stat"><b>'+active+'</b><span>Активных санкций</span></div></div>'+
  '<div class="profile-section"><h3>Данные профиля</h3><div class="profile-grid">'+field("Имя",name)+field("Email",email)+field("Город",profile.city)+field("Дата регистрации",date(u.created_at))+field("Последний вход",date(u.last_sign_in_at))+field("ID пользователя",id)+'</div><div class="actions"><button onclick="openSanction(\''+id+'\',null)">Назначить санкцию</button></div></div>'+
  '<div class="profile-section"><h3>Объявления ('+ownedListings.length+')</h3>'+ (ownedListings.length?ownedListings.map(l=>'<div class="profile-item"><b>'+esc(l.title)+'</b> <span class="status">'+esc(ruStatus(l.status))+'</span><div class="meta">'+date(l.created_at)+' · '+esc(l.id)+'</div><button onclick="viewListing(\''+l.id+'\')">Открыть объявление</button></div>').join(""):'<div class="empty">Объявлений нет</div>')+'</div>'+
  '<div class="profile-section"><h3>Жалобы ('+reports.length+')</h3>'+ (reports.length?reports.map(r=>'<div class="profile-item"><b>'+esc(r.report_type||"Жалоба")+'</b> <span class="status">'+esc(ruStatus(r.status))+'</span><p>'+esc(r.reason||"Без описания")+'</p><div class="meta">'+date(r.created_at)+' · ID '+esc(r.id)+(r.listing_id?' · Объявление '+esc(r.listing_id):'')+'</div><div class="actions"><button onclick="reportAction(\''+r.id+'\',\'reviewed\')">Проверить</button><button onclick="reportAction(\''+r.id+'\',\'resolved\')">Решить</button></div></div>').join(""):'<div class="empty">Жалоб не найдено</div>')+'</div>'+
  '<div class="profile-section"><h3>Санкции ('+sanctions.length+')</h3>'+ (sanctions.length?sanctions.map(x=>'<div class="profile-item"><b>'+esc(ruStatus(x.sanction_type))+'</b> <span class="status">'+(x.revoked_at?'Отменена':'Назначена')+'</span><p>'+esc(x.reason)+'</p><div class="meta">'+date(x.created_at)+' · до '+date(x.ends_at)+'</div></div>').join(""):'<div class="empty">Санкций нет</div>')+'</div>'+
  '<div class="profile-section"><h3>История нарушений ('+violations.length+')</h3>'+ (violations.length?violations.map(v=>'<div class="profile-item"><b>'+esc(v.violation_type||v.type||"Нарушение")+'</b><p>'+esc(v.reason||v.description||"")+'</p><div class="meta">'+date(v.created_at)+'</div></div>').join(""):'<div class="empty">Нарушений не зафиксировано</div>')+'</div></div>';
 }catch(e){box.innerHTML='<div class="profile-body">Не удалось загрузить карточку: '+esc(e.message)+'<button onclick="userProfileDialog.close()">Закрыть</button></div>'}
}
function openSanction(user,report){$("targetId").value=user;$("reason").value="";$("dialogTitle").textContent="Санкция пользователю";actionDialog.dataset.report=report||"";$("actionDialog").showModal()}
$("actionForm").onsubmit=async e=>{e.preventDefault();let id=$("targetId").value,type=$("sanctionType").value,reason=$("reason").value.trim();if(!confirm("Подтвердить санкцию: "+ruStatus(type)+"?"))return;let {error}=await sb.rpc("admin_apply_sanction",{p_user_id:id,p_report_id:actionDialog.dataset.report||null,p_type:type,p_reason:reason,p_duration_hours:type==="temporary_ban"?Number($("duration").value):null,p_severity:$("severity").value});if(error)return err(error);actionDialog.close();alert("Санкция применена");await loadSanctions();await loadLogs();};
async function loadSanctions(){let {data,error}=await sb.from("user_sanctions").select("*").is("revoked_at",null).order("created_at",{ascending:false}).limit(100);if(error)return err(error);$("sanctionsList").innerHTML=data.length?data.map(s=>'<article class="item"><h3>'+esc(ruStatus(s.sanction_type))+' <span class="status">Действует</span></h3><div>'+esc(s.reason)+'</div><div class="meta">Пользователь: '+esc(s.user_id)+' · До: '+date(s.ends_at)+'</div><div class="actions"><button onclick="revoke(\''+s.id+'\')">Отменить санкцию</button></div></article>').join(""):'<div class="empty">Активных санкций нет</div>'}
async function revoke(id){let note=prompt("Причина отмены санкции:","");if(note===null)return;let {data,error}=await sb.rpc("admin_revoke_sanction",{p_sanction_id:id,p_note:note});if(error)return err(error);if(!data)alert("Санкция уже отменена");await loadSanctions();await loadLogs()}
async function searchListings(){
 let q=$("listingQuery").value.trim();let query=sb.from("listings").select("id,title,user_id,status,created_at").order("created_at",{ascending:false}).limit(50);
 if(q){if(/^[0-9a-f-]{36}$/i.test(q))query=query.eq("id",q);else query=query.ilike("title","%"+q+"%");}
 let {data,error}=await query;if(error)return err(error);data=data||[];
 const ids=data.map(l=>l.id);let reportMap={};
 if(ids.length){let rr=await sb.from("reports").select("id,listing_id,reason,status,created_at,reported_user_id").in("listing_id",ids).order("created_at",{ascending:false});if(!rr.error)(rr.data||[]).forEach(r=>(reportMap[r.listing_id]||(reportMap[r.listing_id]=[])).push(r));}
 $("listingsList").innerHTML=data.length?data.map(l=>{let rs=reportMap[l.id]||[];return '<article class="item"><h3>'+esc(l.title)+' <span class="status">'+esc(ruStatus(l.status))+'</span></h3><div class="meta">ID: '+esc(l.id)+' · Пользователь: '+esc(l.user_id)+' · '+date(l.created_at)+'</div><div class="profile-section"><b>Жалобы на объявление ('+rs.length+')</b>'+(rs.length?rs.map(r=>'<div class="profile-item"><span class="status">'+esc(ruStatus(r.status))+'</span><p>'+esc(r.reason||"Без описания")+'</p><div class="meta">'+date(r.created_at)+' · ID '+esc(r.id)+'</div><button onclick="viewReportUser(\''+r.reported_user_id+'\')">Карточка нарушителя</button></div>').join(""):'<p class="meta">Жалоб нет</p>')+'</div><div class="actions"><button onclick="userDetails(\''+l.user_id+'\')">Профиль владельца</button><button onclick="viewListing(\''+l.id+'\')">Открыть карточку</button><button onclick="listingModerate(\''+l.id+'\',\'hide\')">Скрыть</button><button onclick="listingModerate(\''+l.id+'\',\'restore\')">Восстановить</button><button class="danger" onclick="listingModerate(\''+l.id+'\',\'archive\')">В архив</button></div></article>'}).join(""):'<div class="empty">Объявления не найдены</div>';
}
function viewReportUser(id){if(id)userDetails(id)}
async function listingModerate(id,action){let note=prompt("Комментарий модерации:","");if(note===null)return;let {error}=await sb.rpc("admin_set_listing_moderation",{p_listing_id:id,p_action:action,p_note:note});if(error)return err(error);await searchListings();await loadLogs()}
function resetLogFilters(){["logAction","logSearch","logFrom","logTo"].forEach(id=>$(id).value="");loadLogs()}
async function loadLogs(){let {data,error}=await sb.rpc("admin_get_action_log",{p_limit:500});if(error)return err(error);let rows=data||[],action=$("logAction").value,q=$("logSearch").value.trim().toLowerCase(),from=$("logFrom").value,to=$("logTo").value;rows=rows.filter(l=>{let d=l.details||{},hay=[l.actor_id,l.target_user_id,l.report_id,d.ticket_id,d.listing_id].join(" ").toLowerCase(),day=(l.created_at||"").slice(0,10);return(!action||(action==="report"&&String(l.action).startsWith("report_"))||(action==="support"&&String(l.action).startsWith("support_"))||(action==="sanction"&&String(l.action).startsWith("sanction_"))||(action==="listing"&&String(l.action).startsWith("listing_")))&&(!q||hay.includes(q))&&(!from||day>=from)&&(!to||day<=to)});const labels={sanction_applied:"Назначена санкция",sanction_revoked:"Санкция отменена",listing_hidden:"Объявление скрыто",listing_restored:"Объявление восстановлено",listing_archived:"Объявление архивировано",support_ticket_replied:"Ответ отправлен в поддержку",report_reviewed:"Жалоба проверена",report_resolved:"Жалоба решена",report_dismissed:"Жалоба отклонена",report_reopened:"Жалоба возвращена в работу"};const detailText=d=>{if(!d||typeof d!=="object")return "";let p=[];if(d.ticket_id)p.push("Обращение: "+d.ticket_id);if(d.status)p.push("Статус: "+ruStatus(d.status));if(d.note)p.push("Комментарий: "+d.note);if(d.reason)p.push("Причина: "+d.reason);if(d.sanction_type)p.push("Мера: "+ruStatus(d.sanction_type));if(d.listing_id)p.push("Объявление: "+d.listing_id);return p.join(" · ")||"Дополнительных сведений нет"};$("logsList").innerHTML=rows.length?'<div class="meta">Найдено: '+rows.length+' · загружено последних 500 записей</div>'+rows.map(l=>'<article class="item"><h3>'+esc(labels[l.action]||l.action||"Действие администратора")+'</h3><div class="meta">'+date(l.created_at)+' · Администратор: '+esc(l.actor_id||"—")+' · Пользователь: '+esc(l.target_user_id||"—")+' · Жалоба: '+esc(l.report_id||"—")+'</div><p>'+esc(detailText(l.details))+'</p></article>').join(""):'<div class="empty">По фильтрам записей нет</div>'}
init();
</script></body></html>
